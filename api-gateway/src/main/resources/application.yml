server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service-route
              uri: http://localhost:8081
              predicates:
                - Path=/api/orders/**

            - id: inventory-service-route
              uri: http://localhost:8082
              predicates:
                - Path=/api/inventory/**